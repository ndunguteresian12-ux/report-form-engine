name: Daily Database Backup

on:
  schedule:
    # 2:00 AM UTC daily (~5:00 AM Nairobi time) — a quiet hour for the app
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allows manual triggering — this is exactly what the "Backup Now"
    # button in the Super Admin Portal calls via GitHub's API.

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client (for pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python backup_db.py
